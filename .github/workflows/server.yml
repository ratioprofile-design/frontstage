name: Shared project server
on:
  push:
    paths: ['Server/**', 'Sources/FrontstageCore/**', '.github/workflows/server.yml', 'Package.swift', 'scripts/build-web.mjs', 'vercel.json']
  pull_request:
    paths: ['Server/**', 'Sources/FrontstageCore/**', '.github/workflows/server.yml', 'Package.swift', 'scripts/build-web.mjs', 'vercel.json']
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-24.04
    container: swift:6.0.3-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 nodejs npm
      - name: Build pinned server dependencies
        run: swift build --package-path Server -j 3
      - name: Exercise authentication and concurrent document updates
        run: python3 Server/Tests/smoke.py
      - name: Install browser validation runtime
        run: |
          npm install --prefix Server/Tests --no-save --no-package-lock playwright@1.56.1
          Server/Tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Validate browser merge and offline editing
        run: |
          set -o pipefail
          mkdir -p build
          node scripts/generate-workspace-design.mjs --check
          node Server/Tests/workspace-model.mjs
          node Server/Tests/merge.mjs
          node Server/Tests/board-operations.mjs
          node Server/Tests/browser-smoke.mjs 2>&1 | tee build/browser.log
          node scripts/build-web.mjs
          FRONTSTAGE_STATIC_BROWSER=1 node Server/Tests/browser-smoke.mjs 2>&1 | tee build/browser-static.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Frontstage-browser-validation
          path: |
            build/browser-*.png
            build/browser.log
