name: Windows native client
on:
  push:
    paths: ['Sources/FrontstageWindows/**', 'Sources/FrontstageCore/**', 'Tests/FrontstageCoreTests/**', 'Package.swift', 'Resources/Brand/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Sources/FrontstageWindows/**', 'Sources/FrontstageCore/**', 'Tests/FrontstageCoreTests/**', 'Package.swift', 'Resources/Brand/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE
          update-sdk-modules: true
      - name: Configure Swift test and Foundation runtime paths
        shell: pwsh
        run: |
          $roots = @((Join-Path $env:LOCALAPPDATA 'Programs/Swift'), (Join-Path $env:ProgramFiles 'Swift')) | Where-Object { Test-Path $_ }
          $directories = $roots | ForEach-Object { Get-ChildItem $_ -Filter '*.dll' -Recurse } | Where-Object { $_.Name -match '^(XCTest|Testing|swiftCore|Foundation|dispatch)' -and $_.FullName -notmatch 'aarch64|arm64' } | Select-Object -ExpandProperty DirectoryName -Unique
          foreach ($directory in $directories) { $directory | Out-File $env:GITHUB_PATH -Encoding utf8 -Append }
      - name: Build native Windows whiteboard
        shell: pwsh
        run: |
          swift --version
          New-Item -ItemType Directory -Force build | Out-Null
          $rc = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/rc.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$rc) { throw 'Windows resource compiler is missing' }
          $light = (Resolve-Path Resources/Brand/dot-light.ico).Path.Replace('\','/')
          $dark = (Resolve-Path Resources/Brand/dot-dark.ico).Path.Replace('\','/')
          @"
          1 ICON "$light"
          2 ICON "$dark"
          1 VERSIONINFO
          FILEVERSION 0,1,0,0
          PRODUCTVERSION 0,1,0,0
          FILEOS 0x40004
          FILETYPE 0x1
          BEGIN
            BLOCK "StringFileInfo"
            BEGIN
              BLOCK "040904B0"
              BEGIN
                VALUE "CompanyName", "Ratioprofile Design"
                VALUE "FileDescription", "DOT"
                VALUE "ProductName", "DOT"
                VALUE "FileVersion", "0.1.0"
                VALUE "ProductVersion", "0.1.0"
                VALUE "OriginalFilename", "DOT.exe"
              END
            END
            BLOCK "VarFileInfo"
            BEGIN
              VALUE "Translation", 0x409, 1200
            END
          END
          "@ | Set-Content build/DOT.rc
          & $rc.FullName /nologo /fo build/DOT.res build/DOT.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --product FrontstageWindows -c release -j 2 -Xlinker "$PWD/build/DOT.res" 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test shared model on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          swift test -j 2 --filter 'Whiteboard.*Tests|ProjectMergeTests|DocumentMergeTests|ScriptSequenceTests|OfficeArchiveTests|ScreenplayToolsTests' 2>&1 | Tee-Object windows-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke native popup and project save
        shell: pwsh
        run: |
          .build/release/FrontstageWindows.exe --ui-smoke build/windows-ui-sample.dot 2>&1 | Tee-Object windows-ui.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect development executable and runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/DOT-Windows | Out-Null
          Copy-Item .build/release/FrontstageWindows.exe build/DOT-Windows/DOT.exe
          if ((Get-Item build/DOT-Windows/DOT.exe).VersionInfo.ProductName -ne 'DOT') { throw 'DOT executable metadata is missing' }
          foreach ($directory in ($env:Path -split ';')) {
            if ($directory -and (Test-Path (Join-Path $directory 'swiftCore.dll'))) {
              Copy-Item (Join-Path $directory '*.dll') build/DOT-Windows/ -Force
            }
          }
          Compress-Archive -Path build/DOT-Windows -DestinationPath build/DOT-Windows.zip
      - name: Report build failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path windows-build.log) {
            Get-Content windows-build.log | Select-String 'error:' | Select-Object -First 25 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          }
          if (Test-Path windows-tests.log) {
            Get-Content windows-tests.log | Select-String 'error:|fatal|failed|error LNK|Exception|not found|terminated|exited' | Where-Object { $_.Line -notmatch 'warning:' } | Select-Object -First 25 | ForEach-Object { Write-Output "::error::$($_.Line)" }
            Get-Content windows-tests.log | Select-Object -Last 30 | ForEach-Object { Write-Output "::error::$_" }
          }
          if (Test-Path windows-ui.log) { Get-Content windows-ui.log | Select-Object -Last 15 | ForEach-Object { Write-Output "::error::$_" } }
      - uses: actions/upload-artifact@v4
        with:
          name: DOT-Windows-development
          path: build/DOT-Windows.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOT-Windows-validation
          path: |
            windows-build.log
            windows-tests.log
            windows-ui.log
            build/windows-ui-sample.dot
