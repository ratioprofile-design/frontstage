name: Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: swift --version
      - name: Test project model and persistence
        run: swift test --parallel
      - name: Build and validate native app bundle
        run: ./scripts/build-macos-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Frontstage-macOS-development
          path: build/Frontstage-macOS.zip
