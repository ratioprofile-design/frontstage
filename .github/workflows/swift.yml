name: Swift
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: swift --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate shared design and browser workspaces
        run: |
          set -o pipefail
          mkdir -p build
          {
            npm install --prefix Server/Tests --no-save --no-package-lock playwright@1.56.1
            Server/Tests/node_modules/.bin/playwright install chromium
            node scripts/generate-workspace-design.mjs --check
            node scripts/build-web.mjs
            node Server/Tests/dot-branding.mjs
            node Server/Tests/dot-branding-browser.mjs
            node Server/Tests/screenplay-writing-rules.mjs
            node Server/Tests/story-timeline.mjs
            node Server/Tests/workspace-model.mjs
            node Server/Tests/scene-model.mjs
            node Server/Tests/scene-cards-browser.mjs
            node Server/Tests/script-inclusion.mjs
            node Server/Tests/antigravity-adoption.mjs
            node Server/Tests/antigravity-browser.mjs
            node Server/Tests/continuous-inclusion-browser.mjs
            node Server/Tests/write-panel-model.mjs
            node Server/Tests/write-panels-browser.mjs
            node Server/Tests/write-interface-browser.mjs
            node Server/Tests/write-navigation-browser.mjs
            node Server/Tests/writer-typing-browser.mjs
            node Server/Tests/writer-keyboard-browser.mjs
            node Server/Tests/writer-actions-browser.mjs
            node Server/Tests/writer-scroll-browser.mjs
            node Server/Tests/write-mobile-browser.mjs
            node Server/Tests/workspace-parity.mjs
            node Server/Tests/timeline-layout.mjs
            node Server/Tests/whiteboard-text-layout.mjs
            node Server/Tests/script-filter.mjs
            node Server/Tests/filter-reader.mjs
            node Server/Tests/whiteboard-delete.mjs
            node Server/Tests/whiteboard-delete-browser.mjs
          } 2>&1 | tee build/browser-validation.log
      - name: Report browser validation failure
        if: failure()
        run: |
          python3 - <<'PYREPORT'
          from pathlib import Path
          p = Path('build/browser-validation.log')
          if p.exists():
              log = '\n'.join(line for line in p.read_text().splitlines() if not line.startswith('|'))
              print('::error::' + log[-3000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYREPORT
      - name: Test project model and persistence
        if: ${{ !cancelled() }}
        env:
          FRONTSTAGE_PARITY_OUTPUT: ${{ github.workspace }}/build/parity
          FRONTSTAGE_PARITY_DOCUMENT: ${{ github.workspace }}/build/parity/browser-edited.frontstage
          FRONTSTAGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
        run: |
          set -o pipefail
          mkdir -p build
          swift test --parallel --xunit-output build/test-results.xml 2>&1 | tee build/test.log
      - name: Report test results
        if: always()
        run: python3 scripts/report-tests.py
      - name: Build and validate native app bundle
        run: |
          set -o pipefail
          ./scripts/build-macos-app.sh 2>&1 | tee build/build.log
          ./scripts/build-dmg.sh --skip-build 2>&1 | tee -a build/build.log
      - name: Report build diagnostics
        if: failure()
        run: python3 scripts/report-tests.py --build
      - uses: actions/upload-artifact@v4
        with:
          name: DOT-macOS-development
          path: |
            build/DOT-macOS.zip
            build/DOT.dmg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOT-screenplay-validation
          path: |
            build/test-results.xml
            build/test.log
            build/browser-validation.log
            build/build.log
            build/test-artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DOT-page-parity
          path: build/parity/
