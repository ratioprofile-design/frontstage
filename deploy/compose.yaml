services:
  server:
    build:
      context: ..
      dockerfile: Server/Dockerfile
    restart: unless-stopped
    environment:
      FRONTSTAGE_WEB_ORIGIN: https://frontstage-five.vercel.app
      FRONTSTAGE_ALLOW_SIGNUP: ${FRONTSTAGE_ALLOW_SIGNUP:-0}
    volumes:
      - projects:/data
    expose:
      - "8080"
    stop_grace_period: 30s
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      FRONTSTAGE_SERVICE_DOMAIN: ${FRONTSTAGE_SERVICE_DOMAIN:?Set the backend hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on:
      server:
        condition: service_healthy
volumes:
  projects:
  certificates:
  proxy_config:
